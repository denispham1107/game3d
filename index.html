<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#100b0b">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PhuThuy3D">
    <meta name="application-name" content="PhuThuy3D">
    <meta name="description" content="Chơi PhuThuy3D trực tiếp trên trình duyệt hoặc cài đặt như một ứng dụng.">
    <title>PhuThuy3D</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./TemplateData/style.css">
    <link rel="stylesheet" href="./styles/game-shell.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1" aria-label="PhuThuy3D game"></canvas>
      <div id="unity-loading-bar" role="status" aria-live="polite" aria-label="Đang tải game">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning" hidden></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <button id="unity-fullscreen-button" type="button" aria-label="Toàn màn hình"></button>
        <div id="unity-build-title">PhuThuy3D</div>
      </div>
    </div>

    <noscript>Trình duyệt phải bật JavaScript để chạy game.</noscript>
    <script>
      "use strict";

      const GAME_BUILD_VERSION = "20260901-a06fc6786ef1-iosadaptive1";
      const IOS_RENDER_PROFILE_VERSION = "20260901-1";
      const IOS_RENDER_PROFILE_KEY = "phuthuy3d-ios-render-profile";
      const IOS_LAUNCH_STATE_KEY = "phuthuy3d-ios-launch-state";
      const IOS_PROFILE_TTL_MS = 7 * 24 * 60 * 60 * 1000;
      const IOS_INTERRUPTED_LAUNCH_TTL_MS = 48 * 60 * 60 * 1000;
      // UNITY_BUILD_CONFIG_START
      const UNITY_BUILD_CONFIG = Object.freeze({
        "loaderUrl": "Build/phuthuy-mobile7.loader.js",
        "dataUrl": "Build/phuthuy-mobile7.data",
        "frameworkUrl": "Build/phuthuy-mobile7.framework.js",
        "codeUrl": "Build/phuthuy-mobile7.wasm",
        "streamingAssetsUrl": "StreamingAssets",
        "companyName": "DefaultCompany",
        "productName": "PhuThuy3D",
        "unityProductVersion": "1.0"
      });
      // UNITY_BUILD_CONFIG_END
      const versionedUrl = (url) => `${url}${url.includes("?") ? "&" : "?"}v=${encodeURIComponent(GAME_BUILD_VERSION)}`;

      function unityShowBanner(message, type) {
        const warningBanner = document.querySelector("#unity-warning");
        const item = document.createElement("div");
        item.textContent = message;
        item.className = `unity-message unity-message-${type || "info"}`;
        warningBanner.appendChild(item);
        warningBanner.hidden = false;
        if (type !== "error") {
          window.setTimeout(() => {
            item.remove();
            warningBanner.hidden = warningBanner.children.length === 0;
          }, 5000);
        }
      }

      function readLocalJson(key) {
        try {
          return JSON.parse(localStorage.getItem(key) || "null");
        } catch {
          return null;
        }
      }

      function writeLocalJson(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {
          // Private browsing or storage pressure can make localStorage fail.
        }
      }

      function getIOSRenderPlan(isIPhone) {
        if (!isIPhone) {
          return { tier: "ipad-retina", initialDpr: 2, shouldProbe: false };
        }

        const now = Date.now();
        const previousLaunch = readLocalJson(IOS_LAUNCH_STATE_KEY);
        const previousLaunchWasInterrupted = previousLaunch
          && previousLaunch.version === IOS_RENDER_PROFILE_VERSION
          && previousLaunch.complete !== true
          && now - previousLaunch.startedAt < IOS_INTERRUPTED_LAUNCH_TTL_MS;
        if (previousLaunchWasInterrupted) {
          return { tier: "recovery", initialDpr: 1.25, shouldProbe: false };
        }

        const saved = readLocalJson(IOS_RENDER_PROFILE_KEY);
        if (saved && saved.version === IOS_RENDER_PROFILE_VERSION && saved.expiresAt > now) {
          if (saved.tier === "retina") return { tier: "retina", initialDpr: 2, shouldProbe: false };
          if (saved.tier === "balanced") return { tier: "balanced", initialDpr: 1.5, shouldProbe: true };
          if (saved.tier === "low") return { tier: "low", initialDpr: 1.25, shouldProbe: false };
        }

        // Safari intentionally does not expose an exact iPhone generation.
        // Four-core/older devices use the safe tier immediately; all other
        // iPhones start balanced and are promoted only after a live frame test.
        const logicalCores = Number(navigator.hardwareConcurrency) || 0;
        if (logicalCores > 0 && logicalCores <= 4) {
          return { tier: "low", initialDpr: 1.25, shouldProbe: false };
        }
        return { tier: "adaptive", initialDpr: 1.5, shouldProbe: true };
      }

      function rememberIOSRenderTier(tier) {
        writeLocalJson(IOS_RENDER_PROFILE_KEY, {
          version: IOS_RENDER_PROFILE_VERSION,
          tier,
          expiresAt: Date.now() + IOS_PROFILE_TTL_MS,
        });
      }

      function beginIOSLaunchGuard(tier) {
        writeLocalJson(IOS_LAUNCH_STATE_KEY, {
          version: IOS_RENDER_PROFILE_VERSION,
          startedAt: Date.now(),
          complete: false,
          tier,
        });

        // A normal navigation/close should not be mistaken for a WebKit crash.
        window.addEventListener("pagehide", () => {
          const state = readLocalJson(IOS_LAUNCH_STATE_KEY);
          if (state?.version === IOS_RENDER_PROFILE_VERSION) {
            state.complete = true;
            writeLocalJson(IOS_LAUNCH_STATE_KEY, state);
          }
        });
        window.addEventListener("pageshow", (event) => {
          if (!event.persisted) return;
          const state = readLocalJson(IOS_LAUNCH_STATE_KEY);
          if (state?.version === IOS_RENDER_PROFILE_VERSION) {
            state.startedAt = Date.now();
            state.complete = false;
            writeLocalJson(IOS_LAUNCH_STATE_KEY, state);
          }
        });
      }

      function enableIOSRetinaRendering(canvas, initialDpr) {
        // iPad keeps Retina DPR. iPhone starts from a device-specific adaptive
        // cap after Unity's DPR-1 initialization and may change cap at runtime.
        const MAX_RENDER_PIXELS = 5_800_000;
        let dprCap = Math.max(1, Math.min(2, initialDpr || 2));
        let resizeTimer;

        const resizeRenderTarget = () => {
          const bounds = canvas.getBoundingClientRect();
          const cssWidth = Math.max(1, bounds.width);
          const cssHeight = Math.max(1, bounds.height);
          const nativeDpr = Math.max(1, window.devicePixelRatio || 1);
          const budgetDpr = Math.sqrt(MAX_RENDER_PIXELS / (cssWidth * cssHeight));
          const renderDpr = Math.max(1, Math.min(nativeDpr, dprCap, budgetDpr));
          const renderWidth = Math.round(cssWidth * renderDpr);
          const renderHeight = Math.round(cssHeight * renderDpr);

          if (canvas.width !== renderWidth) canvas.width = renderWidth;
          if (canvas.height !== renderHeight) canvas.height = renderHeight;
          canvas.dataset.renderScale = renderDpr.toFixed(2);
          canvas.dataset.renderTier = dprCap >= 2 ? "retina" : dprCap <= 1.25 ? "low" : "balanced";
        };

        const scheduleResize = () => {
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(resizeRenderTarget, 120);
        };

        resizeRenderTarget();
        window.addEventListener("resize", scheduleResize, { passive: true });
        window.visualViewport?.addEventListener("resize", scheduleResize, { passive: true });
        if ("ResizeObserver" in window) new ResizeObserver(scheduleResize).observe(canvas);
        return {
          getDprCap: () => dprCap,
          setDprCap: (nextDpr) => {
            dprCap = Math.max(1, Math.min(2, nextDpr));
            resizeRenderTarget();
          },
        };
      }

      function measureFrameHealth(durationMs = 6000) {
        return new Promise((resolve) => {
          const samples = [];
          const startedAt = performance.now();
          let previousFrame = 0;

          const sampleFrame = (now) => {
            if (previousFrame > 0) {
              const delta = now - previousFrame;
              // Ignore a background/sleep gap; it does not describe GPU load.
              if (delta > 0 && delta < 250) samples.push(delta);
            }
            previousFrame = now;
            if (now - startedAt < durationMs) {
              requestAnimationFrame(sampleFrame);
              return;
            }

            if (samples.length < 90) {
              resolve({ healthy: false, averageFps: 0, longFrameRatio: 1 });
              return;
            }
            const total = samples.reduce((sum, value) => sum + value, 0);
            const averageFps = 1000 / (total / samples.length);
            const longFrameRatio = samples.filter((value) => value > 34).length / samples.length;
            resolve({
              healthy: averageFps >= 50 && longFrameRatio <= 0.12,
              averageFps,
              longFrameRatio,
            });
          };

          requestAnimationFrame(sampleFrame);
        });
      }

      async function tuneIPhoneRendering(renderer, plan) {
        if (plan.tier === "recovery" || plan.tier === "low") {
          renderer.setDprCap(1.25);
          rememberIOSRenderTier("low");
          return;
        }

        if (plan.tier === "retina") {
          const health = await measureFrameHealth(7000);
          if (!health.healthy) {
            renderer.setDprCap(1.5);
            rememberIOSRenderTier("balanced");
          }
          return;
        }

        // Ambiguous models (including iPhone 12/13, which share browser-visible
        // characteristics) remain at DPR 1.5 unless the running Unity game is
        // stable. A candidate Retina promotion is tested again and reverted if
        // frame pacing degrades.
        const balancedHealth = await measureFrameHealth(6000);
        if (!balancedHealth.healthy) {
          renderer.setDprCap(1.25);
          rememberIOSRenderTier("low");
          return;
        }

        // Step through DPR 1.75 first. Requiring near-60 fps here prevents an
        // older iPhone from making a risky jump straight from 1.5 to 2.
        renderer.setDprCap(1.75);
        const candidateHealth = await measureFrameHealth(7000);
        if (candidateHealth.averageFps < 56 || candidateHealth.longFrameRatio > 0.05) {
          renderer.setDprCap(1.5);
          rememberIOSRenderTier("balanced");
          return;
        }

        renderer.setDprCap(2);
        const retinaHealth = await measureFrameHealth(7000);
        if (retinaHealth.healthy) {
          rememberIOSRenderTier("retina");
        } else {
          renderer.setDprCap(1.5);
          rememberIOSRenderTier("balanced");
        }
      }

      async function startUnity() {
        const canvas = document.querySelector("#unity-canvas");
        const container = document.querySelector("#unity-container");
        const loadingBar = document.querySelector("#unity-loading-bar");
        const progressBar = document.querySelector("#unity-progress-bar-full");
        const fullscreenButton = document.querySelector("#unity-fullscreen-button");
        const build = UNITY_BUILD_CONFIG;
        if (!build) throw new Error("Không tìm thấy cấu hình Unity WebGL.");

        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
          || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const isIPhone = /iPhone|iPod/i.test(navigator.userAgent);
        const iosRenderPlan = isIOS ? getIOSRenderPlan(isIPhone) : null;
        const isMobile = isIOS || /Android/i.test(navigator.userAgent) || matchMedia("(pointer: coarse)").matches;
        container.className = isMobile ? "unity-mobile" : "unity-desktop";
        canvas.className = isMobile ? "unity-mobile" : "unity-desktop";

        const config = {
          arguments: [],
          dataUrl: versionedUrl(build.dataUrl),
          frameworkUrl: versionedUrl(build.frameworkUrl),
          codeUrl: versionedUrl(build.codeUrl),
          streamingAssetsUrl: build.streamingAssetsUrl,
          companyName: build.companyName,
          productName: build.productName,
          productVersion: GAME_BUILD_VERSION,
          showBanner: unityShowBanner,
        };
        if (isIOS) {
          // WebKit keeps Unity's unpacked .data file in memory. Avoid a second
          // Cache Storage copy. Start with a small render target during the
          // memory-heavy initialization, then enable adaptive Retina rendering.
          config.cacheControl = () => "no-store";
          config.matchWebGLToCanvasSize = false;
          const bounds = canvas.getBoundingClientRect();
          canvas.width = Math.max(1, Math.round(bounds.width));
          canvas.height = Math.max(1, Math.round(bounds.height));
          if (isIPhone) beginIOSLaunchGuard(iosRenderPlan.tier);
        } else if (isMobile) {
          config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        }

        loadingBar.style.display = "block";
        const loader = document.createElement("script");
        loader.src = versionedUrl(build.loaderUrl);
        loader.async = true;
        return new Promise((resolve, reject) => {
          loader.onerror = () => reject(new Error(`Không thể tải Unity loader: ${build.loaderUrl}`));
          loader.onload = async () => {
            try {
              const unityInstance = await createUnityInstance(canvas, config, (progress) => {
                progressBar.style.width = `${100 * progress}%`;
              });
              if (isIOS) {
                const renderer = enableIOSRetinaRendering(canvas, iosRenderPlan.initialDpr);
                canvas.dataset.renderPlan = iosRenderPlan.tier;
                if (isIPhone) {
                  tuneIPhoneRendering(renderer, iosRenderPlan)
                    .catch((error) => console.warn("iPhone render tuning failed:", error));
                }
              }
              loadingBar.style.display = "none";
              fullscreenButton.addEventListener("click", () => unityInstance.SetFullscreen(1));
              resolve(unityInstance);
            } catch (error) {
              reject(error);
            }
          };
          document.body.appendChild(loader);
        });
      }

      async function registerServiceWorker() {
        if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
        try {
          const registration = await navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" });
          await registration.update();
        } catch (error) {
          console.warn("Service worker registration failed:", error);
        }
      }

      startUnity()
        .then(() => {
          // Registration/update performs extra network and storage work. Wait
          // until Unity has finished its memory-heavy startup on mobile WebKit.
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(() => registerServiceWorker(), { timeout: 4000 });
          } else {
            window.setTimeout(() => registerServiceWorker(), 1500);
          }
        })
        .catch((error) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          unityShowBanner(error instanceof Error ? error.message : String(error), "error");
        });
    </script>
  </body>
</html>
